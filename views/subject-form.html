<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="" />
        <meta name="author" content="" />
        <title>Ensaya - Nueva Asignatura</title>
        <!--FAV ICON (ICON THAT APPEARS IN THE BROWSER)-->
        <link rel="icon" type="image/svg+xml" href="/assets/logo-icon.svg" />
        <!-- Bootstrap icons-->
        <link href="/css/bootstrap-icons.css" rel="stylesheet" />
        <!-- Bootstrap CSS (v5.2.3)-->
        <link href="/css/bootstrap.min.css" rel="stylesheet" />
        <!-- Custom styles for the web -->
        <link href="/css/custom.css" rel="stylesheet" />
    </head>

    <body>
        {{>navbar}}   

        <!-- Header -->
        <header class="bg-dark py-5">
            <div class="container px-4 px-lg-5 my-5">
                <div class="text-center text-white">
                    <h1 class="display-5 fw-bolder">Nueva Asignatura</h1>
                    <p class="lead fw-normal text-white-50 mb-0">Añadir una nueva asignatura al catálogo</p>
                </div>
            </div>
        </header>

        <!--Form-->
        
        <main class="container my-5">
            <div class="row justify-content-center">
                <div class="col-12 col-md-8">       
                    <div class="card p-4">        
                        <h2 class="card-title mb-4">Nueva Asignatura</h2>
                
                        <!-- enctype="multipart/form-data is needed as the form contains a file upload-->
                        <form id="new-subject-form" action="" method="POST" enctype="multipart/form-data">

                            <!--Title-->

                            <div class="mb-4">
                                <label for="title" class="form-label fw-bold"> Título de la asignatura</label>
                                <input type="text" class="form-control" id="title" name="title" placeholder="Fundamentos de la Web" required>
                            </div>

                            <!--Description-->

                            <div class="mb-4">
                                <label for="description" class="form-label fw-bold">Descripción de la asignatura</label>
                                <textarea class="form-control" id="description" name="description" rows="4" placeholder="Esta asignatura trata sobre los fundamentos de la web..." required></textarea>
                            </div>

                            <!--Course year-->

                            <div class="mb-4">
                                <label for="course-year" class="form-label fw-bold">Curso académico</label>
                                <select class="form-select" id="course-year" name="course-year" required>
                                    <option value="primero">1º</option>
                                    <option value="segundo">2º</option>
                                    <option value="tercero">3º</option>
                                    <option value="cuarto">4º</option>
                                </select>
                            </div>

                            <!--Cuatrimestre-->
                    
                            <div class="mb-4">
                                <label for="semester" class="form-label fw-bold">Cuatrimestre</label>
                                <select class="form-select" id="semester" name="semester" required>
                                    <option value="primero">Primer cuatrimestre</option>
                                    <option value="segundo">Segundo cuatrimestre</option>
                                </select>
                            </div>

                            <!--Image-->

                            <div class="mb-4">
                                <label for="image" class="form-label fw-bold"> Imagen de portada </label>
                                <input class="form-control" type="file" id="image" name="image" accept="image/*">
                                <div class="form-text"> Formatos recomendados: JPG, PNG. Tamaño máximo: 2MB.</div>
                            </div>

                            <!--Buttons-->

                            <a href="index.html" class="btn btn-secondary px-4"> Cancelar</a>
                            <button type="submit" class="btn btn-urjc px-4"><i class="bi bi-save me-2"></i>Guardar</button>
              
                        </form>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer-->
        {{>footer}} <!-- with mustache we can include partials -->
    </body>
</html>

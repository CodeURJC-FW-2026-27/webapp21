
    {{> head}} <!-- with mustache we can include partials -->
    <body>
        {{>navbar}}<!-- with mustache we can include partials -->
        <!-- Header-->
        <header class="bg-dark py-5">
            <div class="container px-4 px-lg-5 my-5">
                <div class="text-center text-white">
                    <h1 class="display-4 fw-bolder">Ensaya</h1>
                    <p class="lead fw-normal text-white-50 mb-0">Por estudiantes. Para estudiantes.</p>
                </div>
            </div>
        </header>
        <!-- Catalog section-->
         <!--We are using course-anchor class to prevent half-cut cards, 
         see the definition of the class in custom.css for more info-->
        <section class="py-5 course-anchor" id="subjects">
            <div class="container px-4 px-lg-5 mt-5">
                <!-- Button to create a new subject -->
                <div class="d-flex justify-content-end mb-4">
                    <a href="subject-form.html" class="btn btn-urjc"><i class="bi-plus-circle me-1"></i>Crear nueva asignatura</a>
                </div>    
                <!-- Subjects grid: 1 column on mobile, 2 on md, 3 on lg. Each card links to the detail page of its subject -->
                <div class="row gx-4 gx-lg-5 row-cols-1 row-cols-md-2 row-cols-lg-3 justify-content-center">
                    {{#subjects}}
                    <div class="col mb-5">
                        <div class="card h-100 shadow-sm border-0">
                            <!-- Subject image-->
                            <img class="card-img-top" src="/uploads/{{image}}" alt="Imagen de {{name}}" />
                            <!-- Subject details-->
                            <div class="card-body p-4">
                                <div class="text-center">
                                    <!-- Subject name-->
                                    <h5 class="fw-bolder">{{name}}</h5>
                                    <!-- Subject course year and semester-->
                                    <p class="text-muted mb-2">{{courseYear}}º Curso &middot; {{semester}}º Cuatrimestre</p>
                                    <!-- Subject description-->
                                    <p>{{description}}</p>
                                </div>
                            </div>
                            <!-- Subject actions-->
                            <div class="card-footer p-4 pt-0 border-top-0 bg-transparent">
                                <div class="text-center"><a class="btn btn-outline-dark mt-auto" href="/detail/{{id}}">Ver detalles</a></div>
                            </div>
                        </div>
                    </div>
                    {{/subjects}}
                </div>
        </section>
        
        {{>footer}} <!-- with mustache we can include partials -->
    </body>
</html>

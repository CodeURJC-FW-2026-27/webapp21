<div class="col-12">
    <label for="title" class="form-label fw-bold">Título del simulacro</label>
    <input type="text" class="form-control" id="title" name="title" placeholder="Título" value="{{test.title}}" required minlength="3" maxlength="100" />
    <div class="form-text">Longitud requerida: entre 3 y 100 caracteres.</div>
</div>
<div class="col-12">
    <label for="description" class="form-label fw-bold">Descripción</label>
    <textarea class="form-control" id="description" name="description" rows="3" placeholder="Descripción" required minlength="20" maxlength="500" oninvalid="this.setCustomValidity(this.validity.valueMissing ? 'Por favor, rellena este campo.' : (this.validity.tooShort ? 'La descripción debe tener al menos 20 caracteres (actualmente tiene ' + this.value.length + (this.value.length === 1 ? ' carácter).' : ' caracteres).') : ''))" oninput="this.setCustomValidity('')">{{test.description}}</textarea>
    <div class="form-text">Longitud requerida: entre 20 y 500 caracteres.</div>
</div>

<!-- Exam duration -->
<div class="col-md-6">
    <label for="duration" class="form-label fw-bold">Duración (minutos)</label>
    <input type="number" class="form-control" id="duration" name="duration" min="15" max="240" step="1" value="{{#test.duration}}{{test.duration}}{{/test.duration}}{{^test.duration}}60{{/test.duration}}" required />
    <div class="form-text">Número entero entre 15 y 240 minutos.</div>
</div>

<!-- Exam difficulty -->
<div class="col-md-6">
    <label for="difficulty" class="form-label fw-bold">Dificultad</label>
    <select class="form-select" id="difficulty" name="difficulty" required>
        <option value="easy" {{#isEasy}}selected{{/isEasy}}>Fácil</option>
        <option value="medium" {{#isMedium}}selected{{/isMedium}}>Intermedio</option>
        <option value="hard" {{#isHard}}selected{{/isHard}}>Difícil</option>
    </select>
</div>
